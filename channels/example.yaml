# Example channel. This is the only YAML this repository carries.
#
# Real channel config lives outside the repo, next to the media it names: /srv/channel3/channels on the Pi and ~/srv/channel3/channels on the Mac.
# Copy this file there, rename it after the channel, and edit it.
#
# One file is one channel. Every file in the directory is loaded, and every number must be unique across all of them.
#
# id: lowercase letters, digits and dashes. It names the library directory at <root>/library/<id>.
# number: 1 to 999. This is what you type on the remote.
# name: what the guide shows.
# sources: one entry per video, playlist or file. An entry takes any of the three forms below.
# bumper: optional. The card shown for a moment after tuning here: a background colour written as #RRGGBB, and optionally the name of an SVG icon in <root>/icons. Leave it out for no card.
# A channel with no sources is allowed. It shows the Please Stand By card until you give it something to play.

id: trains
number: 3
name: Train TV
bumper:
  icon: steam-engine.svg
  color: "#2E6DB4"
sources:
  # A URL. YouTube videos and playlists, and anything else yt-dlp accepts. The video is downloaded into <root>/library/<id> and the title comes from yt-dlp.
  - https://www.youtube.com/watch?v=dQw4w9WgXcQ
  # A path relative to the root, for video you put under <root>/local yourself. It is never copied, and the sidecar records it relatively, so the library plays the same on the Mac and on the Pi. The title is the file name without its extension, with hyphens and underscores read as spaces.
  - local/steam-engines.mp4
  # The same, with the guide title written out. A mapping takes a source in any of these forms and an optional title, which overrides both the file name and what yt-dlp reports.
  - source: local/shunting_yard_1972.mp4
    title: Shunting Yard, 1972
